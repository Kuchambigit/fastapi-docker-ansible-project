---
# Target managed nodes
- hosts: ubuntu

  # Use sudo privileges
  become: yes

  tasks:

    # Install Apache
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    # Start Apache service
    - name: Start Apache
      service:
        name: apache2
        state: started

    # Enable Apache at boot
    - name: Enable Apache
      service:
        name: apache2
        enabled: yes

    # Deploy dynamic webpage
    - name: Deploy dynamic webpage
      template:
        src: ../templates/index.j2
        dest: /var/www/html/index.html
      notify:
        - Restart Apache

  handlers:

    # Restart Apache when template changes
    - name: Restart Apache
      service:
        name: apache2
        state: restarted
