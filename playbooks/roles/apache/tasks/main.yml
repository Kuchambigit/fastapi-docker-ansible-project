---
# Install Apache
- name: Install Apache
  apt:
    name: apache2
    state: present
    update_cache: yes

# Start Apache
- name: Start Apache
  service:
    name: apache2
    state: started

# Enable Apache
- name: Enable Apache
  service:
    name: apache2
    enabled: yes

# Deploy template
- name: Deploy webpage
  template:
    src: index.j2
    dest: /var/www/html/index.html
  notify:
    - Restart Apache
